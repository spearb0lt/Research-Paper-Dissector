<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8f8880"/></marker><marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b8b1aa"/></marker></defs><rect width="1800" height="1200" fill="#ffffff"/><text x="900" y="46" text-anchor="middle" font-size="26" font-weight="680" fill="#1c1a18">Dissect: how a paper becomes an answer you can check</text><text x="900" y="72" text-anchor="middle" font-size="13.5" fill="#55504b">Element level extraction &#183; hybrid retrieval with no vector database &#183; every citation resolves to a box on a page</text><text x="50" y="118" font-size="16" font-weight="700" fill="#1c1a18">(a)&#160;&#160;Ingestion, extraction and indexing</text><line x1="50" y1="684" x2="1750" y2="684" stroke="#e3dfdb" stroke-width="1.5"/><text x="50" y="720" font-size="16" font-weight="700" fill="#1c1a18">(b)&#160;&#160;Question, retrieval and a grounded answer</text><path d="M210 306 C 237.9 306, 244.1 278, 272 278" fill="none" stroke="#8f8880" stroke-width="1.6" marker-end="url(#a)"/><path d="M210 306 C 237.9 306, 244.1 442, 272 442" fill="none" stroke="#b8b1aa" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#ad)"/><path d="M447 278 C 474.9 278, 481.1 176, 509 176" fill="none" stroke="#8f8880" stroke-width="1.6" marker-end="url(#a)"/><path d="M447 278 C 474.9 278, 481.1 242, 509 242" fill="none" stroke="#8f8880" stroke-width="1.6" marker-end="url(#a)"/><path d="M447 278 C 474.9 278, 481.1 308, 509 308" fill="none" stroke="#8f8880" stroke-width="1.6" marker-end="url(#a)"/><path d="M447 278 C 474.9 278, 481.1 374, 509 374" fill="none" stroke="#8f8880" stroke-width="1.6" marker-end="url(#a)"/><path d="M447 278 C 474.9 278, 481.1 440, 509 440" fill="none" stroke="#8f8880" stroke-width="1.6" marker-end="url(#a)"/><path d="M359.5 480 C 359.5 610, 616.5 402, 873.5 356" fill="none" stroke="#b8b1aa" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#ad)"/><path d="M714 176 C 741.9 176, 748.1 292, 776 292" fill="none" stroke="#8f8880" stroke-width="1.6" marker-end="url(#a)"/><path d="M714 242 C 741.9 242, 748.1 292, 776 292" fill="none" stroke="#8f8880" stroke-width="1.6" marker-end="url(#a)"/><path d="M714 308 C 741.9 308, 748.1 292, 776 292" fill="none" stroke="#8f8880" stroke-width="1.6" marker-end="url(#a)"/><path d="M714 374 C 741.9 374, 748.1 292, 776 292" fill="none" stroke="#8f8880" stroke-width="1.6" marker-end="url(#a)"/><path d="M714 440 C 741.9 440, 748.1 292, 776 292" fill="none" stroke="#8f8880" stroke-width="1.6" marker-end="url(#a)"/><path d="M971 292 L 1033 292" fill="none" stroke="#8f8880" stroke-width="1.6" marker-end="url(#a)"/><path d="M1218 292 C 1245.9 292, 1252.1 252, 1280 252" fill="none" stroke="#8f8880" stroke-width="1.6" marker-end="url(#a)"/><path d="M1218 292 C 1245.9 292, 1252.1 360, 1280 360" fill="none" stroke="#8f8880" stroke-width="1.6" marker-end="url(#a)"/><path d="M1475 252 C 1502.9 252, 1509.1 294, 1537 294" fill="none" stroke="#8f8880" stroke-width="1.6" marker-end="url(#a)"/><path d="M1475 360 C 1502.9 360, 1509.1 294, 1537 294" fill="none" stroke="#8f8880" stroke-width="1.6" marker-end="url(#a)"/><path d="M130 354 C 130 569, 570 639, 1010 593" fill="none" stroke="#b8b1aa" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#ad)"/><text x="405" y="585.375" text-anchor="middle" font-size="10.5" fill="#8a837c" font-style="italic">the file itself</text><path d="M611.5 334 C 611.5 539, 893.25 592, 1175 546" fill="none" stroke="#b8b1aa" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#ad)"/><text x="787.59375" y="548.125" text-anchor="middle" font-size="10.5" fill="#8a837c" font-style="italic">figure crops</text><path d="M200 899 L 238 899" fill="none" stroke="#8f8880" stroke-width="1.6" marker-end="url(#a)"/><path d="M423 899 C 449 899, 435 843, 461 843" fill="none" stroke="#8f8880" stroke-width="1.6" marker-end="url(#a)"/><path d="M423 899 C 449 899, 435 957, 461 957" fill="none" stroke="#8f8880" stroke-width="1.6" marker-end="url(#a)"/><path d="M636 843 C 662 843, 648 898, 674 898" fill="none" stroke="#8f8880" stroke-width="1.6" marker-end="url(#a)"/><path d="M636 957 C 662 957, 648 898, 674 898" fill="none" stroke="#8f8880" stroke-width="1.6" marker-end="url(#a)"/><path d="M771.5 952 L 771.5 992" fill="none" stroke="#b8b1aa" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#ad)"/><path d="M869 898 L 907 898" fill="none" stroke="#8f8880" stroke-width="1.6" marker-end="url(#a)"/><path d="M869 1023 C 895 1023, 881 898, 907 898" fill="none" stroke="#b8b1aa" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#ad)"/><path d="M1092 898 L 1130 898" fill="none" stroke="#8f8880" stroke-width="1.6" marker-end="url(#a)"/><path d="M1310 898 L 1348 898" fill="none" stroke="#8f8880" stroke-width="1.6" marker-end="url(#a)"/><path d="M1528 898 L 1566 898" fill="none" stroke="#8f8880" stroke-width="1.6" marker-end="url(#a)"/><rect x="62" y="270" width="160" height="96" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" opacity="0.45"/><rect x="56" y="264" width="160" height="96" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" opacity="0.45"/><rect x="50" y="258" width="160" height="96" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.8"/><text x="130" y="295.75" text-anchor="middle" font-size="13.5" font-weight="650" fill="#1c1a18">Research PDF</text><text x="130" y="314.75" text-anchor="middle" font-size="11.8" fill="#55504b">upload, arXiv id,</text><text x="130" y="329.75" text-anchor="middle" font-size="11.8" fill="#55504b">DOI or URL</text><rect x="272" y="232" width="175" height="92" rx="10" fill="#fdf0dd" stroke="#b45309" stroke-width="1.8"/><text x="359.5" y="267.75" text-anchor="middle" font-size="13.5" font-weight="650" fill="#1c1a18">Fast parser</text><text x="359.5" y="286.75" text-anchor="middle" font-size="11.8" fill="#55504b">PyMuPDF + pdfplumber</text><text x="359.5" y="301.75" text-anchor="middle" font-size="11.8" fill="#55504b">no models, ~25 MB</text><rect x="272" y="404" width="175" height="76" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.8" stroke-dasharray="6 4"/><text x="359.5" y="431.75" text-anchor="middle" font-size="13.5" font-weight="650" fill="#1c1a18">Deep parser</text><text x="359.5" y="450.75" text-anchor="middle" font-size="11.8" fill="#55504b">Docling + TableFormer</text><text x="359.5" y="465.75" text-anchor="middle" font-size="11.8" fill="#55504b">off on serverless</text><rect x="509" y="150" width="205" height="52" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.8"/><text x="611.5" y="173.25" text-anchor="middle" font-size="13.5" font-weight="650" fill="#1c1a18">Text runs</text><text x="611.5" y="192.25" text-anchor="middle" font-size="11.8" fill="#55504b">headings, paragraphs, lists</text><rect x="509" y="216" width="205" height="52" rx="10" fill="#f3ebff" stroke="#7c3aed" stroke-width="1.8"/><text x="611.5" y="239.25" text-anchor="middle" font-size="13.5" font-weight="650" fill="#1c1a18">Tables</text><text x="611.5" y="258.25" text-anchor="middle" font-size="11.8" fill="#55504b">ruling bands, x-projection</text><rect x="509" y="282" width="205" height="52" rx="10" fill="#ffeee4" stroke="#c2410c" stroke-width="1.8"/><text x="611.5" y="305.25" text-anchor="middle" font-size="13.5" font-weight="650" fill="#1c1a18">Figures</text><text x="611.5" y="324.25" text-anchor="middle" font-size="11.8" fill="#55504b">embedded, plus rendered crops</text><rect x="509" y="348" width="205" height="52" rx="10" fill="#e2f1fb" stroke="#0369a1" stroke-width="1.8"/><text x="611.5" y="371.25" text-anchor="middle" font-size="13.5" font-weight="650" fill="#1c1a18">Equations</text><text x="611.5" y="390.25" text-anchor="middle" font-size="11.8" fill="#55504b">no body font on the line</text><rect x="509" y="414" width="205" height="52" rx="10" fill="#eef5dd" stroke="#4d7c0f" stroke-width="1.8"/><text x="611.5" y="437.25" text-anchor="middle" font-size="13.5" font-weight="650" fill="#1c1a18">References</text><text x="611.5" y="456.25" text-anchor="middle" font-size="11.8" fill="#55504b">split, markers linked</text><rect x="776" y="228" width="195" height="128" rx="10" fill="#d6f0ec" stroke="#0f766e" stroke-width="1.8"/><text x="873.5" y="274.25" text-anchor="middle" font-size="13.5" font-weight="650" fill="#1c1a18">elements</text><text x="873.5" y="293.25" text-anchor="middle" font-size="11.8" fill="#55504b">one row per element</text><text x="873.5" y="308.25" text-anchor="middle" font-size="11.8" fill="#55504b">kind, page, bbox, order</text><text x="873.5" y="323.25" text-anchor="middle" font-size="11.8" fill="#55504b">section path, label, caption</text><rect x="1033" y="240" width="185" height="104" rx="10" fill="#d6f0ec" stroke="#0f766e" stroke-width="1.8"/><text x="1125.5" y="274.25" text-anchor="middle" font-size="13.5" font-weight="650" fill="#1c1a18">Chunker</text><text x="1125.5" y="293.25" text-anchor="middle" font-size="11.8" fill="#55504b">450 tokens, 80 overlap</text><text x="1125.5" y="308.25" text-anchor="middle" font-size="11.8" fill="#55504b">section path prepended</text><text x="1125.5" y="323.25" text-anchor="middle" font-size="11.8" fill="#55504b">tables and figures whole</text><rect x="1280" y="214" width="195" height="76" rx="10" fill="#e2f1fb" stroke="#0369a1" stroke-width="1.8"/><text x="1377.5" y="241.75" text-anchor="middle" font-size="13.5" font-weight="650" fill="#1c1a18">BM25 index</text><text x="1377.5" y="260.75" text-anchor="middle" font-size="11.8" fill="#55504b">science tokeniser keeps</text><text x="1377.5" y="275.75" text-anchor="middle" font-size="11.8" fill="#55504b">41.0 and BLEU-4 whole</text><rect x="1280" y="322" width="195" height="76" rx="10" fill="#e5f4e9" stroke="#15803d" stroke-width="1.8"/><text x="1377.5" y="349.75" text-anchor="middle" font-size="13.5" font-weight="650" fill="#1c1a18">Dense matrix</text><text x="1377.5" y="368.75" text-anchor="middle" font-size="11.8" fill="#55504b">ONNX MiniLM, 384-d</text><text x="1377.5" y="383.75" text-anchor="middle" font-size="11.8" fill="#55504b">numpy, exact, no service</text><rect x="1549" y="260" width="215" height="92" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" opacity="0.45"/><rect x="1543" y="254" width="215" height="92" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" opacity="0.45"/><rect x="1537" y="248" width="215" height="92" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.8"/><text x="1644.5" y="283.75" text-anchor="middle" font-size="13.5" font-weight="650" fill="#1c1a18">papers row</text><text x="1644.5" y="302.75" text-anchor="middle" font-size="11.8" fill="#55504b">lexical_index, dense_index</text><text x="1644.5" y="317.75" text-anchor="middle" font-size="11.8" fill="#55504b">stored as BLOBs, read whole</text><path d="M1010 559 a 165 13 0 0 1 330 0 v 68 a 165 13 0 0 1 -330 0 z" fill="#ffffff" stroke="#9ca3af" stroke-width="1.8"/><path d="M1010 559 a 165 13 0 0 0 330 0" fill="none" stroke="#9ca3af" stroke-width="1.8"/><text x="1175" y="589.75" text-anchor="middle" font-size="13.5" font-weight="650" fill="#1c1a18">Blob store, addressed by SHA-256</text><text x="1175" y="608.75" text-anchor="middle" font-size="11.8" fill="#55504b">PDF, figure crops, page renders</text><text x="1175" y="623.75" text-anchor="middle" font-size="11.8" fill="#55504b">the disk, or the database where there is none</text><rect x="50" y="856" width="150" height="86" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.8"/><text x="125" y="888.75" text-anchor="middle" font-size="13.5" font-weight="650" fill="#1c1a18">User question</text><text x="125" y="907.75" text-anchor="middle" font-size="11.8" fill="#55504b">one paper, or</text><text x="125" y="922.75" text-anchor="middle" font-size="11.8" fill="#55504b">the whole library</text><rect x="238" y="844" width="185" height="110" rx="10" fill="#d6f0ec" stroke="#0f766e" stroke-width="1.8"/><text x="330.5" y="881.25" text-anchor="middle" font-size="13.5" font-weight="650" fill="#1c1a18">Query analysis</text><text x="330.5" y="900.25" text-anchor="middle" font-size="11.8" fill="#55504b">label pinning:</text><text x="330.5" y="915.25" text-anchor="middle" font-size="11.8" fill="#55504b">“Figure 3” is a lookup,</text><text x="330.5" y="930.25" text-anchor="middle" font-size="11.8" fill="#55504b">not a ranking problem</text><rect x="461" y="804" width="175" height="78" rx="10" fill="#e2f1fb" stroke="#0369a1" stroke-width="1.8"/><text x="548.5" y="832.75" text-anchor="middle" font-size="13.5" font-weight="650" fill="#1c1a18">Leg A, lexical</text><text x="548.5" y="851.75" text-anchor="middle" font-size="11.8" fill="#55504b">BM25 over chunks,</text><text x="548.5" y="866.75" text-anchor="middle" font-size="11.8" fill="#55504b">cells and captions</text><rect x="461" y="918" width="175" height="78" rx="10" fill="#e5f4e9" stroke="#15803d" stroke-width="1.8"/><text x="548.5" y="946.75" text-anchor="middle" font-size="13.5" font-weight="650" fill="#1c1a18">Leg B, dense</text><text x="548.5" y="965.75" text-anchor="middle" font-size="11.8" fill="#55504b">cosine over the</text><text x="548.5" y="980.75" text-anchor="middle" font-size="11.8" fill="#55504b">384-d matrix</text><rect x="674" y="844" width="195" height="108" rx="10" fill="#d6f0ec" stroke="#0f766e" stroke-width="1.8"/><text x="771.5" y="880.25" text-anchor="middle" font-size="13.5" font-weight="650" fill="#1c1a18">Reciprocal rank fusion</text><text x="771.5" y="899.25" text-anchor="middle" font-size="11.8" fill="#55504b">k = 60, weights shift</text><text x="771.5" y="914.25" text-anchor="middle" font-size="11.8" fill="#55504b">with the query shape,</text><text x="771.5" y="929.25" text-anchor="middle" font-size="11.8" fill="#55504b">then diversify and pin</text><rect x="674" y="992" width="195" height="62" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.8" stroke-dasharray="6 4"/><text x="771.5" y="1020.25" text-anchor="middle" font-size="13.5" font-weight="650" fill="#1c1a18">Cross encoder</text><text x="771.5" y="1039.25" text-anchor="middle" font-size="11.8" fill="#55504b">optional, needs PyTorch</text><rect x="907" y="830" width="185" height="136" rx="10" fill="#e5f4e9" stroke="#15803d" stroke-width="2.6"/><text x="999.5" y="865.25" text-anchor="middle" font-size="13.5" font-weight="650" fill="#1c1a18">Ranked evidence</text><text x="999.5" y="884.25" text-anchor="middle" font-size="11.8" fill="#55504b">page, score, and which</text><text x="999.5" y="899.25" text-anchor="middle" font-size="11.8" fill="#55504b">leg found it</text><text x="999.5" y="929.25" text-anchor="middle" font-size="11.8" fill="#55504b">No model needed.</text><text x="999.5" y="944.25" text-anchor="middle" font-size="11.8" fill="#55504b">Many questions stop here.</text><rect x="1130" y="844" width="180" height="108" rx="10" fill="#fdf0dd" stroke="#b45309" stroke-width="1.8"/><text x="1220" y="880.25" text-anchor="middle" font-size="13.5" font-weight="650" fill="#1c1a18">Context assembly</text><text x="1220" y="899.25" text-anchor="middle" font-size="11.8" fill="#55504b">numbered excerpts</text><text x="1220" y="914.25" text-anchor="middle" font-size="11.8" fill="#55504b">with paper and page,</text><text x="1220" y="929.25" text-anchor="middle" font-size="11.8" fill="#55504b">figure crops attached</text><rect x="1348" y="844" width="180" height="108" rx="10" fill="#e2f1fb" stroke="#0369a1" stroke-width="1.8"/><text x="1438" y="880.25" text-anchor="middle" font-size="13.5" font-weight="650" fill="#1c1a18">Model provider</text><text x="1438" y="899.25" text-anchor="middle" font-size="11.8" fill="#55504b">19, key from the</text><text x="1438" y="914.25" text-anchor="middle" font-size="11.8" fill="#55504b">browser or the server,</text><text x="1438" y="929.25" text-anchor="middle" font-size="11.8" fill="#55504b">streamed as deltas</text><rect x="1566" y="844" width="185" height="108" rx="10" fill="#e5f4e9" stroke="#15803d" stroke-width="1.8"/><text x="1658.5" y="880.25" text-anchor="middle" font-size="13.5" font-weight="650" fill="#1c1a18">Cited answer</text><text x="1658.5" y="899.25" text-anchor="middle" font-size="11.8" fill="#55504b">every [n] resolved</text><text x="1658.5" y="914.25" text-anchor="middle" font-size="11.8" fill="#55504b">against an excerpt,</text><text x="1658.5" y="929.25" text-anchor="middle" font-size="11.8" fill="#55504b">the rest stripped</text><text x="1658.5" y="976" text-anchor="middle" font-size="11" fill="#15803d" font-weight="600">[TEXT &#183; p7]&#160;&#160;[TABLE 2 &#183; p8]&#160;&#160;[FIG 3 &#183; p4]</text><text x="1658.5" y="993" text-anchor="middle" font-size="10.5" fill="#8a837c">each opens the page with the box drawn on it</text><text x="50" y="1126" font-size="12" font-weight="700" fill="#1c1a18">Element kinds, coloured as they are in the app:</text><rect x="346" y="1115" width="22" height="13" rx="3.5" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.6"/><text x="375" y="1126" font-size="12" fill="#55504b">Text</text><rect x="435.8" y="1115" width="22" height="13" rx="3.5" fill="#f3ebff" stroke="#7c3aed" stroke-width="1.6"/><text x="464.8" y="1126" font-size="12" fill="#55504b">Tables</text><rect x="540" y="1115" width="22" height="13" rx="3.5" fill="#ffeee4" stroke="#c2410c" stroke-width="1.6"/><text x="569" y="1126" font-size="12" fill="#55504b">Figures</text><rect x="651.4" y="1115" width="22" height="13" rx="3.5" fill="#e2f1fb" stroke="#0369a1" stroke-width="1.6"/><text x="680.4" y="1126" font-size="12" fill="#55504b">Equations</text><rect x="777.1999999999999" y="1115" width="22" height="13" rx="3.5" fill="#eef5dd" stroke="#4d7c0f" stroke-width="1.6"/><text x="806.1999999999999" y="1126" font-size="12" fill="#55504b">References</text><line x1="914.1999999999999" y1="1122" x2="950.1999999999999" y2="1122" stroke="#b8b1aa" stroke-width="1.6" stroke-dasharray="6 5"/><text x="958.1999999999999" y="1126" font-size="12" fill="#55504b">optional, or unavailable on a serverless tier</text><text x="50" y="1166" font-size="11" fill="#8a837c">Generated by scripts/workflow.mjs. Regenerate with npm run diagram.</text><text x="1750" y="1166" text-anchor="end" font-size="11" fill="#8a837c" font-style="italic">github.com/spearb0lt/Research-Paper-Dissector</text></svg>
